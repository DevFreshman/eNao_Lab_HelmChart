name: userservice

image:
  repository: freethinking04/user-service
  pullPolicy: IfNotPresent
  tag: "latest"

containerPort: 8080

service:
  type: ClusterIP
  port: 8080


resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1250m
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3


config:
  DB_URL: "jdbc:oracle:thin:@//10.100.30.36:1521/ORCLPDB1"
  DB_USERNAME: "data_market"
  JWT_TTL_SECONDS: "8300"
  OTEL_TRACES_ENDPOINT: "http://my-jaeger.monitoring.svc.cluster.local:4318/v1/traces"

secret:
  DB_PASSWORD: "eNao@123."
  JWT_SECRET: "lab-application-secret-key-min-32-characters"